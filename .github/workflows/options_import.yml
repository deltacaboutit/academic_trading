name: Options history import

# One-off imports of extra history (missing days, older files).
# 1. Open the repo's Releases page -> "Import inbox" -> Edit -> attach the files -> Update release.
#    Accepted: chain_history*.parquet, oi_history*.parquet, gex_history*.csv, and *.zip files holding
#    Watchtower-style folders (chains/ticker=XXX/date=YYYY-MM-DD.parquet, optionally features/).
# 2. Actions tab -> "Options history import" -> Run workflow.
# Only days a stock does not already have are added. The inbox is emptied afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-sync          # never at the same time as the nightly sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Install libraries
        run: pip install -r requirements-update.txt
      - name: Download the current per-stock files and the inbox
        run: |
          python -m atrade.release download
          python -m atrade.release inbox-download --dest /tmp/inbox
      - name: Import
        run: |
          date +%Y-%m-%dT%H:%M:%S > /tmp/started
          python -m atrade.import_history --inbox /tmp/inbox
      - name: Upload changed per-stock files
        run: python -m atrade.release upload --since "$(cat /tmp/started)"
      - name: Commit the summary
        run: |
          git config user.name  "options-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add options_data
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -m "Import options history $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Empty the inbox
        run: python -m atrade.release inbox-clear
