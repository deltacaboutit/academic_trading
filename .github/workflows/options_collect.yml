name: Options data collection

# Downloads every stock's option chain from Yahoo Finance after the close and adds the day to
#   - one parquet file per stock, kept as assets of the Release "options-data"
#   - the small daily summary in options_data/summary/ (committed to git)
# Main run about 4:45 pm New York time. The later runs are catch-ups: each run only fetches
# stocks that don't have the session yet, so when the main run succeeded they finish in a minute.
# (GitHub cron times are UTC; two evening times cover both daylight-saving and standard time.)
on:
  schedule:
    - cron: "45 20 * * 1-5"   # 4:45 pm EDT  (3:45 pm EST: before the close, finds nothing to do)
    - cron: "45 21 * * 1-5"   # 5:45 pm EDT / 4:45 pm EST
    - cron: "30 1 * * 2-6"    # 9:30 pm EDT / 8:30 pm EST, catch-up
    - cron: "15 11 * * 2-6"   # 7:15 am EDT / 6:15 am EST next morning, last catch-up
  workflow_dispatch:
    inputs:
      tickers:
        description: "Only these tickers (space separated); empty = all"
        default: ""
      force:
        description: "Collect again even if the session is already there"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: options-data          # never at the same time as the import or another collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install libraries
        run: pip install -r requirements-update.txt

      - name: Anything to collect?
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "todo=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m atrade.collect_chains --check ${{ inputs.tickers && format('--tickers {0}', inputs.tickers) || '' }} | tee /tmp/check
          grep '^todo=' /tmp/check >> "$GITHUB_OUTPUT"

      - name: Download the current per-stock files from the Release
        if: steps.check.outputs.todo != '0'
        run: python -m atrade.release download

      - name: Collect the option chains from Yahoo Finance
        if: steps.check.outputs.todo != '0'
        run: |
          date +%Y-%m-%dT%H:%M:%S > /tmp/started
          python -m atrade.collect_chains ${{ inputs.tickers && format('--tickers {0}', inputs.tickers) || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Upload changed per-stock files to the Release
        if: always() && steps.check.outputs.todo != '0'
        run: python -m atrade.release upload --since "$(cat /tmp/started)"

      - name: Commit the summary
        if: always() && steps.check.outputs.todo != '0'
        run: |
          git config user.name  "options-collect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add options_data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Options data $(TZ=America/New_York date +%F)"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      # Checked only on the last catch-up (and manual runs), so a few stocks Yahoo was slow to
      # publish at 4:45 pm don't turn the evening run red; they are fetched by the catch-ups.
      - name: Is the session complete? (red X if fewer than 95% of stocks were collected)
        if: always() && steps.check.outputs.todo != '0' && (github.event.schedule == '15 11 * * 2-6' || (github.event_name == 'workflow_dispatch' && inputs.tickers == ''))
        run: python -m atrade.collect_chains --check-complete
