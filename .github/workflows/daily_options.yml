name: Daily options update

# Runs at 4:30 pm New York time on weekdays. GitHub schedules use UTC and
# ignore daylight saving, so there are two times; the script itself checks
# the New York clock, the NYSE holiday calendar and whether today is already
# collected, so only one run per trading day does any work.
on:
  schedule:
    - cron: "30 20 * * 1-5"   # 4:30 pm EDT (summer)
    - cron: "30 21 * * 1-5"   # 4:30 pm EST (winter)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 4:15 pm+ window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: options-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install libraries
        run: pip install -r requirements-update.txt

      - name: Collect today's options chain
        run: python -m atrade.update_options ${{ inputs.force && '--force' || '' }}

      - name: Commit and push the new data
        run: |
          git config user.name  "options-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add options_data
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Options data for $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
