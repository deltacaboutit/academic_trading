name: Research run (all stocks)

# Framework 9 on every stock in price_data/ (bootstrap against random prices, random-series
# patterns, Reality Check), the [LMW] 9b tests, and the Framework 7 weight tuning.
# Start it from the Actions tab -> "Research run (all stocks)" -> Run workflow.
# Results are committed to results/ when it finishes (about 1-2 hours).
on:
  workflow_dispatch:
    inputs:
      B:
        description: "Artificial price histories per null model (book: 100; Brock et al. and the framework: 500)"
        default: "500"
      shards:
        description: "Parallel jobs (max 20)"
        default: "20"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: LMW bandwidth and directions (training data only)
        run: python -m atrade.research calibrate
      - id: m
        run: python -c "import json; n=int('${{ inputs.shards }}'); print('shards=' + json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lmw-settings
          path: |
            results/lmw_settings.json
            results/summary/lmw_9b_training.csv

  stocks:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.calibrate.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Start from an empty results folder (only this run's files are uploaded)
        run: rm -rf results work
      - uses: actions/download-artifact@v4
        with: { name: lmw-settings, path: results/ }
      - name: Per-stock work
        run: python -m atrade.research stocks --shard ${{ matrix.shard }} --of ${{ inputs.shards }} --B ${{ inputs.B }} --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            work/
            results/bootstrap/
            results/random_patterns/

  combine:
    needs: stocks
    # runs if some batches failed (their stocks are listed as failed), but NOT if the run was cancelled
    if: ${{ !cancelled() && needs.stocks.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Start from an empty results folder (this run replaces the previous one completely)
        run: rm -rf results work
      - uses: actions/download-artifact@v4
        with: { name: lmw-settings, path: results/ }
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: shards/ }
      - name: Merge shard outputs
        run: |
          mkdir -p work results
          for d in shards/*/; do cp -r "$d"* . 2>/dev/null || true; done
          ls work/stocks | wc -l
      - name: Pooled tests and weight tuning
        run: python -m atrade.research combine
      - name: Commit results (replacing the previous run's results)
        run: |
          git config user.name  "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset -q --mixed origin/main      # newest main; this run's files stay in the folder
            git add -A results                    # adds new files and removes old ones
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Research results $(date +%F) (B=${{ inputs.B }})"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved while saving; trying again"
          done
          exit 1
