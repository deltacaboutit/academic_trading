name: Options data sync

# Copies each new day from the Watchtower repo (which collects the Yahoo
# option chains every evening) into this repo:
#   - one parquet file per stock, kept as assets of the Release "options-data"
#   - the small daily summary in options_data/summary/ (committed to git)
# Watchtower's run usually finishes between 5:30 pm and 10 pm New York time,
# so this runs at 11:15 pm and again at 7:15 am New York time (UTC times below,
# daylight-saving shift included). Each run only processes days it has not
# seen yet, so extra runs are harmless.
on:
  schedule:
    - cron: "15 3 * * 2-6"    # 11:15 pm EDT / 10:15 pm EST, Mon-Fri evenings
    - cron: "15 11 * * 2-6"   # 7:15 am EDT / 6:15 am EST, catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install libraries
        run: pip install -r requirements-update.txt

      - name: Download the current per-stock files from the Release
        run: python -m atrade.release download

      - name: Copy new days from Watchtower
        run: |
          date +%Y-%m-%dT%H:%M:%S > /tmp/started
          python -m atrade.watchtower --work /tmp/watchtower

      - name: Upload changed per-stock files to the Release
        run: |
          python -m atrade.release upload --since "$(cat /tmp/started)"
          python -c "from atrade.release import get_release, INBOX_TAG; get_release(True, INBOX_TAG)"

      - name: Commit the summary
        run: |
          git config user.name  "options-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add options_data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Options summary sync $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
